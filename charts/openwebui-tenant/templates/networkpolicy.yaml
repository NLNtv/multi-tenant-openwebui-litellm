{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openwebui-zero-trust-netpol
  labels:
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/part-of: openwebui-tenant
    saas.platform.io/tenant-id: {{ .Values.tenant.id | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openwebui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allow traffic to OpenWebUI (port 8080) ONLY from Ingress Controller pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # 1. Allow DNS resolution to CoreDNS in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow egress to Central LiteLLM Gateway in litellm namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-proxy
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.gatewayPort }}
    # 3. Allow egress to Tenant LDAPS / Active Directory Directory Server
    {{- if .Values.ldap.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.ldapServerCidr }}
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: {{ .Values.ldap.serverPort }}
    {{- end }}
{{- end }}
