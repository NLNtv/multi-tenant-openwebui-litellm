apiVersion: v1
kind: Secret
metadata:
  name: openwebui-credentials
  labels:
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/part-of: openwebui-tenant
    saas.platform.io/tenant-id: {{ .Values.tenant.id | quote }}
type: Opaque
stringData:
  # Local LiteLLM Master Key used by OpenWebUI to communicate with local LiteLLM
  LITELLM_MASTER_KEY: {{ .Values.litellm.masterKey | default "sk-tenant-local-key" | quote }}
  # Upstream Provider Keys (BYOK / Scoped Tenant Keys)
  OPENAI_API_KEY: {{ .Values.litellm.upstreamKeys.openaiApiKey | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.litellm.upstreamKeys.anthropicApiKey | default "" | quote }}
  AZURE_API_KEY: {{ .Values.litellm.upstreamKeys.azureOpenaiApiKey | default "" | quote }}
  AZURE_API_BASE: {{ .Values.litellm.upstreamKeys.azureOpenaiEndpoint | default "" | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.litellm.upstreamKeys.awsAccessKeyId | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.litellm.upstreamKeys.awsSecretAccessKey | default "" | quote }}
  AWS_REGION_NAME: {{ .Values.litellm.upstreamKeys.awsRegionName | default "us-east-1" | quote }}
  # OpenWebUI Session Key
  WEBUI_SECRET_KEY: {{ .Values.admin.webuiSecretKey | quote }}
  {{- if .Values.ldap.enabled }}
  LDAP_APP_PASSWORD: {{ .Values.ldap.appPassword | quote }}
  {{- end }}
  {{- if .Values.admin.fallbackEnabled }}
  ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  {{- end }}
  {{- if .Values.ldap.caCert }}
  ldap_ca.crt: |
{{ .Values.ldap.caCert | indent 4 }}
  {{- end }}
