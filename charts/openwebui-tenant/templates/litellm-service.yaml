{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: openwebui-tenant
    saas.platform.io/tenant-id: {{ .Values.tenant.id | quote }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.litellm.port | default 4000 }}
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: litellm
{{- end }}
