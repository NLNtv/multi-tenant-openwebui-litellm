apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    app.kubernetes.io/name: litellm-proxy
    app.kubernetes.io/part-of: litellm-gateway
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ .Values.masterKey | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgresql.username }}:{{ .Values.postgresql.password }}@{{ .Release.Name }}-postgres:5432/{{ .Values.postgresql.database }}"
  OPENAI_API_KEY: {{ .Values.upstreamKeys.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.upstreamKeys.anthropicApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.upstreamKeys.geminiApiKey | quote }}
  COHERE_API_KEY: {{ .Values.upstreamKeys.cohereApiKey | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.upstreamKeys.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.upstreamKeys.awsSecretAccessKey | quote }}
  AWS_REGION_NAME: {{ .Values.upstreamKeys.awsRegionName | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  POSTGRES_USER: {{ .Values.postgresql.username | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
