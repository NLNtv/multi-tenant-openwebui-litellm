apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: litellm-proxy
    app.kubernetes.io/part-of: litellm-gateway
data:
  config.yaml: |
    model_list:
      # Primary Tier-1 Models with Automatic Failover
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
          rpm: 500
          tpm: 150000
      - model_name: gpt-4o
        litellm_params:
          model: anthropic/claude-3-5-sonnet-20240620
          api_key: os.environ/ANTHROPIC_API_KEY
          rpm: 500
          tpm: 150000

      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY
          rpm: 1000
          tpm: 300000

      - model_name: claude-3-5-sonnet
        litellm_params:
          model: anthropic/claude-3-5-sonnet-20240620
          api_key: os.environ/ANTHROPIC_API_KEY
          rpm: 500
          tpm: 150000

      - model_name: claude-3-haiku
        litellm_params:
          model: anthropic/claude-3-haiku-20240307
          api_key: os.environ/ANTHROPIC_API_KEY
          rpm: 1000
          tpm: 300000

      - model_name: gemini-1.5-pro
        litellm_params:
          model: gemini/gemini-1.5-pro-latest
          api_key: os.environ/GEMINI_API_KEY
          rpm: 300
          tpm: 100000

      - model_name: text-embedding-3-small
        litellm_params:
          model: openai/text-embedding-3-small
          api_key: os.environ/OPENAI_API_KEY
          rpm: 2000
          tpm: 500000

    router_settings:
      routing_strategy: usage-based-routing-v2
      num_retries: 3
      timeout: 60
      allowed_fails: 2
      cooldown_time: 30
      fallbacks:
        - gpt-4o: ["claude-3-5-sonnet", "gemini-1.5-pro"]
        - claude-3-5-sonnet: ["gpt-4o"]
        - gpt-4o-mini: ["claude-3-haiku"]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
      disable_spend_logs: false
      enable_pre_call_checks: true
      alerting: []
      
    litellm_settings:
      cache:
        type: redis
        host: {{ .Release.Name }}-redis
        port: 6379
        supported_call_types: ["completion", "acompletion", "embedding", "aembedding"]
      drop_params: true
      request_timeout: 120
      telemetry: false
